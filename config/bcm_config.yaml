system:
  name: BCM v8.5
  version: 8.5.1
  platform: x86
  log_level: DEBUG
  log_file: logs/bcm.log
  simulation: false
# Jeden przełącznik na każdy moduł/podsystem — pełna lista i stan
# także w UI: Settings -> Moduły (GET/POST /api/modules).
#
# ZAKRES BIEŻĄCEGO WDROŻENIA (v8.5.3): pogoda, planowanie trasy, Android Auto
# i pody SWC na kierownicy. Reszta jest wyłączona, bo nie ma podłączonego
# sprzętu — moduł bez czujnika nie „nic nie robi", tylko zaśmieca logi
# i publikuje wartości udawane albo zerowe.
#
# Powrót do pełnej konfiguracji to zmiana false → true przy danej linii.
modules:
  # --- WŁĄCZONE ---
  dashboard: true          # UI na :5002 — wszystkie cztery funkcje renderują się tutaj
  weather: true            # pogoda (wymaga weather.api_key i internetu)
  route_planner: true      # planowanie trasy (wymaga travel.openrouteservice_key)
  multimedia: true         # Android Auto — potrzebuje binarki autoapp, patrz
                           # config/scripts/install-openauto.sh
  bluetooth: true          # bootstrap AA + CoD carkit; sam handshake AA robi
                           # btservice wbudowany w autoapp
  wifi_ap: true            # P2P-GO na MT7921 — łącze danych Android Auto
  input: true              # pody SWC przez Pro Micro (USB HID)
  audio: true              # dźwięk przez gniazdo słuchawkowe — patrz blok audio:

  # --- WYŁĄCZONE: brak sprzętu albo poza zakresem ---
  obd: false               # brak CP2102 + L9637D
  parking: false           # brak HC-SR04
  environment: false       # brak DS18B20
  camera: false            # brak kamer i grabera
  power: false             # zasilanie idzie wprost spod zapłonu, bez bufora;
                           # PowerManager i tak nie usypia maszyny na x86
  location: false          # brak GPS
  tracking: false          # zależy od GPS
  network: false           # tylko raportuje stan modemu LTE
  blinker_monitor: false
  rain_sensor: false
  central_lock: false
  esp32_display: false     # mały panel 1,8" na ESP32-S3 — brak płytki,
                           # patrz docs/WYSWIETLACZ_ESP32_1V8.md
  lighting: false
  performance: false
  alarm: false
  crash_detect: false
  battery: false
  # podsystemy (startowane wprost w main.py):
  phonebook: false         # PBAP — kontakty z telefonu, poza zakresem
  fuel_sender: false       # czujnik paliwa jest na A4, którego Pro Micro nie ma
  wifi_hotspot: false      # ALFA-NET wymaga OSOBNEGO radia (dongla USB) —
                           # MT7921 zgłasza #{AP, P2P-GO} <= 1
  small_display: false     # drugi ekran 6,86" — na razie jeden panel
display:
  dashboard:
    width: 1280
    height: 800
    fps: 15
    theme: heritage
    brightness: 70
  multimedia:
    width: 1280
    height: 800
  small:
    width: 1280
    height: 480
  appbar_px: 48
  navbar_px: 48
units:
  speed: km/h
  temperature: C
language: pl
gpio:
  parking_trig: 79
  parking_echo:
  - 80
  - 81
  - 82
  - 83
  buzzer: 84
  backlight_dashboard: 32
  backlight_multimedia: 33
  onewire: 7
  ignition: 85
  door: 86
  rain_sensor: 87
  sprayer: 88
  central_lock: 89
  blinker_left: 90
  blinker_right: 91
vehicle:
  blinker_active_low: true
  blinker_hold_sec: 0.8
esp32_display:
  # Most do wyświetlacza pomocniczego 1,8" (src/dashboard/esp32_link.py).
  # Stała ścieżka z reguły udev — numeracja /dev/ttyACM* przeskakuje między
  # restartami, a na tej samej rodzinie węzłów siedzi już Pro Micro.
  port: /dev/ttyACM_display
  baudrate: 115200
  # Gdy reguły udev nie ma, skanuj /dev/ttyACM0..3. Znaleziony port musi
  # odpowiedzieć PONG, żeby nie zapisać metadanych do Pro Micro
  # (oba Nano są na /dev/ttyUSB* i skan ich nie widzi).
  scan: true
  ping_interval: 2.0   # ESP32 uznaje BCM za offline po 5 s ciszy
  # Jednostka bt.media_position / bt.media_duration na magistrali:
  # "ms" (BlueZ/AVRCP, tak jest dzisiaj) albo "s".
  time_unit: ms
serial:
  kline:
    port_opi: /dev/ttyS3
    port_x86: /dev/ttyUSB_kline   # CP2102/VIAKEN KKL — patrz reguła udev
                                  # w docs/KLINE_SNIFFING.md §5.4
    baudrate: 10400
    ecu_address: 1
obd:
  use_real_hardware: false   # x86 produkcja: ustaw true, żeby czytać z
                             # prawdziwego ECU zamiast symulatora
  fast_init: false           # true tylko jeśli adapter/ECU wspiera fast init
hardware:
  gps:
    enabled: true
    port: /dev/ttyUSB0
    baudrate: 9600
  lte:
    enabled: true
    device: ''
    apn: ''
audio:
  # Wyjście dźwięku. "auto" = wybierz wbudowane wyjście analogowe i pomiń
  # HDMI (na M910q HDMI prawie zawsze jest podłączone i prawie nigdy nie o to
  # chodzi). Możesz też wpisać fragment node.name z `wpctl status --name`,
  # np. alsa_output.pci-0000_00_1f.3.analog-stereo
  sink: auto
  # Sink sprzętowy trzymamy na maksimum, a użytkownik reguluje głośność na
  # sinku EQ. Inaczej regulacja działa na jednym, a cichy jest drugi.
  hw_volume: 100
  # Świeży Realtek potrafi wstać z włączonym Auto-Mute i wyciszonym
  # Headphone — wtedy nic nie zagra mimo poprawnego routingu.
  force_unmute: true
  eq_dsp_enabled: true   # prawdziwy EQ przez PipeWire filter-chain
  eq_preset: jazz
  master_volume: 70
  bass: 0
  treble: 0
  fader: 0
  balance: 0
  spectrum_enabled: true
  dac: ES9038Q2M
  # Opisowe, nieczytane przez kod. Wzmacniacz to gotowy moduł samochodowy
  # na osobnej gałęzi 12 V — patrz docs/ZASILANIE_BUFOROWANE.md § 2.
  amp_main: car-amp-4ch
  amp_sub: none
  mic_phone: ''
  voice_duck_pct: 40
  voice_listen_sec: 8
camera:
  segment_minutes: 5
  max_storage_gb: 128
  recording_path: /media/dashcam
  front_device: /dev/video0
  rear_device: /dev/video1
  left_device: /dev/video2
  right_device: /dev/video3
  controller: true
swc:
  enabled: true
  mapping:
    volume_up:
    - SWC_VOLUP
    - SWC2_VOLUP
    volume_down:
    - SWC_VOLDN
    - SWC2_VOLDN
    next_track:
    - SWC_NEXT
    - SWC2_NEXT
    prev_track:
    - SWC_PREV
    - SWC2_PREV
    mute:
    - SWC_MUTE
    - SWC2_MUTE
    phone_pickup:
    - SWC_PICKUP
    - SWC2_PICKUP
    phone_hangup:
    - SWC_HANGUP
    - SWC2_HANGUP
    bcm_power_toggle:
    - SWC_MODE
    - SWC2_MODE
    voice_aa_trigger:
    - SWC_VOICE
    - SWC2_VOICE
    navigate_aa:
    - SWC_SRC
    - SWC2_SRC
    menu_up:
    - SWC_UP
    - SWC2_UP
    menu_down:
    - SWC_DOWN
    - SWC2_DOWN
brightness:
  mode: auto
  steps:
  - 15
  - 30
  - 45
  - 60
  - 80
  - 100
music_panel:
  enabled: true
fuel_sender:
  enabled: true
  calibration:
  - - 20
    - 100
  - - 50
    - 75
  - - 120
    - 50
  - - 220
    - 25
  - - 360
    - 5
  - - 400
    - 0
  tank_capacity_litres: 58
wifi:
  # WiFi wyłącznie do Android Auto wireless (Wi-Fi Direct / P2P-GO na
  # karcie wewnętrznej). Sterowane przełącznikiem modules.wifi_ap.
  enabled: true
  ssid: ALFA
  password: 87654321
  mode: p2p_go
  band: a
  channel: 149
  country: US
  regdom: US
  share_internet: true
  interface: ''
  ip: 10.0.0.1
  netmask: 255.255.255.0
  dhcp_start: 10.0.0.10
  dhcp_end: 10.0.0.50
  # Dodatkowy Access Point ALFA-NET (współdzielenie internetu). Wymaga
  # OSOBNEGO interfejsu WiFi (dongla USB) — karta wewnętrzna nie robi
  # P2P-GO i AP naraz. Włącza się przełącznikiem modules.wifi_hotspot;
  # ten klucz jest jego odpowiednikiem (utrzymywany w synchronizacji).
  alfa_net:
    enabled: false
    ssid: ALFA-NET
    password: AlfaRomeo156
    channel: 6
    country: US
    ip: 10.0.1.1
    netmask: 255.255.255.0
    dhcp_start: 10.0.1.10
    dhcp_end: 10.0.1.50
    share_internet: true
  # ssid_runtime / password_runtime / bssid_runtime są USTAWIANE W LOCIE przez
  # wifi_ap.py po utworzeniu grupy P2P-GO i zapisywane tutaj. Nie wpisuj ich
  # ręcznie: Wi-Fi Direct generuje nowe SSID i hasło przy każdej grupie, a
  # nieaktualna para trafia do openauto.ini i telefon dostaje namiary na sieć,
  # która już nie istnieje. Puste = użyj ssid/password powyżej do czasu, aż AP
  # zgłosi prawdziwe wartości.
  ssid_runtime: ''
  password_runtime: ''
  bssid_runtime: ''
weather:
  api_key: 631c2365675e193584b0f986798554c1
  poll_interval_min: 15
  default_lat: 50.06
  default_lon: 19.94
travel:
  openrouteservice_key: ''
  tomtom_key: ''
power:
  shutdown_delay_seconds: 30
  backlight_fade_ms: 1000
  standby_max_hours: 24
  splash_duration_seconds: 15
  ignition_watcher:
    gpio_chip: gpiochip0
    ignition_line: 7
    bench_button_line: 21
    debounce_ms: 200
    active_low: true
    autostart: true
    suspend_on_stop: true
    suspend_delay_seconds: 5
rain_sensor:
  sensitivity: medium
central_lock:
  port: /dev/ttyUSB1
  baudrate: 9600
lighting:
  follow_me_home_seconds: 60
  greeting_blinks: 2
  leaving_home: true
traffic:
  api_key: ''
  provider: tomtom
  poll_interval_min: 5
remote_status:
  api_key: ''
alarm:
  siren_duration: 60
  arming_delay: 30
  sensors:
    door: true
    motion: true
    tilt: true
    shock: true
crash_detection:
  speed_drop_threshold: 30
  g_force_threshold: 3.0
  post_crash_record_sec: 60
tracking:
  db_path: data/gps_tracks.db
  interval_sec: 30
  trip_start_kmh: 5
  trip_end_kmh: 2
  trip_end_idle_sec: 60
  lte_sync_min: 15
  geofence_lat: 0
  geofence_lon: 0
  geofence_radius_km: 0
  sms_number: ''
multimedia:
  last_bt_device: C0:7A:D6:90:E9:CC
bluetooth:
  enabled: true
  preferred_adapter: ''
