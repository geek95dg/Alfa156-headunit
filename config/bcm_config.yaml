system:
  name: BCM v7
  version: 0.1.0
  platform: x86
  log_level: DEBUG
  log_file: logs/bcm.log
modules:
  dashboard: true
  obd: true
  parking: true
  environment: true
  audio: true
  voice: true
  input: true
  camera: true
  power: true
  multimedia: true
  location: true
  network: true
  weather: true
  blinker_monitor: true      # GPIO watcher that publishes vehicle.left_blinker/right_blinker
display:
  dashboard:
    width: 800
    height: 480
    fps: 15
    theme: heritage
    brightness: 70
  multimedia:
    width: 1024
    height: 600
units:
  speed: km/h
  temperature: C
language: pl
gpio:
  parking_trig: 79
  parking_echo:
  - 80
  - 81
  - 82
  - 83
  buzzer: 84
  backlight_dashboard: 32
  backlight_multimedia: 33
  onewire: 7
  ignition: 85
  door: 86
  rain_sensor: 87
  sprayer: 88
  central_lock: 89
  # Turn signal inputs (via PC817 optoisolator from 12V blinker wires)
  blinker_left: 90
  blinker_right: 91
serial:
  kline:
    port_opi: /dev/ttyS3
    baudrate: 10400
    ecu_address: 1
hardware:
  gps:
    enabled: true
    port: /dev/ttyUSB0
    baudrate: 9600
  lte:
    enabled: true
    device: ""
    apn: ""
audio:
  eq_preset: jazz
  master_volume: 70
  dac: ES9038Q2M
  amp_main: TDA7388
  amp_sub: TDA2050
  mic_vosk: ""          # PipeWire node name for Vosk voice control mic (USB condenser, ceiling)
  mic_phone: ""         # PipeWire node name for phone calls / Android Auto mic (USB/BT headset)
voice:
  wake_word_sensitivity: medium
  model_pl: src/voice/models/vosk-model-small-pl
  model_en: src/voice/models/vosk-model-small-en-us
camera:
  segment_minutes: 5
  max_storage_gb: 128
  recording_path: /media/dashcam
  # 4-camera set via USB 4-channel AHD grabber
  # Default mapping — override per deployment if v4l2 enumerates differently
  front_device: /dev/video0
  rear_device: /dev/video1
  left_device: /dev/video2
  right_device: /dev/video3
  # Enable the multi-camera controller with priority logic
  # (reverse_gear > left_blinker > right_blinker)
  controller: true
swc:
  enabled: true
  buttons:
    SWC_VOLUP: volume_up
    SWC_VOLDN: volume_down
    SWC_UP: menu_up
    SWC_DOWN: menu_down
    SWC_MUTE: mute
    SWC_MODE: home
    SWC_NEXT: next_track
    SWC_PREV: prev_track
    SWC_PICKUP: phone_pickup
    SWC_HANGUP: phone_hangup
    SWC_VOICE: voice_trigger
    SWC_SRC: source_cycle
brightness:
  mode: auto
  steps:
  - 15
  - 30
  - 45
  - 60
  - 80
  - 100
music_panel:
  enabled: true
wifi:
  enabled: true
  ssid: ALFA
  password: 87654321
  channel: 6
  interface: ''
  ip: 10.0.0.1
  netmask: 255.255.255.0
  dhcp_start: 10.0.0.10
  dhcp_end: 10.0.0.50
weather:
  api_key: "631c2365675e193584b0f986798554c1"
  poll_interval_min: 15
  default_lat: 50.06    # Fallback when no GPS fix (Krakow)
  default_lon: 19.94
power:
  shutdown_delay_seconds: 30
  backlight_fade_ms: 1000
# v8.5 new modules
rain_sensor:
  sensitivity: medium
central_lock:
  port: /dev/ttyUSB1
  baudrate: 9600
lighting:
  follow_me_home_seconds: 60
  greeting_blinks: 2
  leaving_home: true
traffic:
  api_key: ""
  provider: tomtom
  poll_interval_min: 5
remote_status:
  api_key: ""
modules_v85:
  rain_sensor: true
  central_lock: true
  lighting: true
  performance: true
  alarm: true
  crash_detect: true
  battery_backup: true
alarm:
  siren_duration: 60
  arming_delay: 30
  sensors:
    door: true
    motion: true
    tilt: true
    shock: true
crash_detection:
  speed_drop_threshold: 30
  g_force_threshold: 3.0
  post_crash_record_sec: 60
tracking:
  interval_sec: 30
  lte_sync_min: 15
  geofence_lat: 0
  geofence_lon: 0
  geofence_radius_km: 0
  sms_number: ""
