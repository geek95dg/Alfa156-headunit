wifi:
  # WiFi wyłącznie do Android Auto wireless (Wi-Fi Direct / P2P-GO na
  # karcie wewnętrznej). Sterowane przełącznikiem modules.wifi_ap.
  enabled: true
  ssid: ALFA
  password: 87654321
  mode: p2p_go
  band: a
  channel: 149
  country: US
  regdom: US
  share_internet: true
  interface: ''
  ip: 10.0.0.1
  netmask: 255.255.255.0
  dhcp_start: 10.0.0.10
  dhcp_end: 10.0.0.50
  # Dodatkowy Access Point ALFA-NET (współdzielenie internetu). Wymaga
  # OSOBNEGO interfejsu WiFi (dongla USB) — karta wewnętrzna nie robi
  # P2P-GO i AP naraz. Włącza się przełącznikiem modules.wifi_hotspot;
  # ten klucz jest jego odpowiednikiem (utrzymywany w synchronizacji).
  alfa_net:
    enabled: false
    ssid: ALFA-NET
    password: AlfaRomeo156
    channel: 6
    country: US
    ip: 10.0.1.1
    netmask: 255.255.255.0
    dhcp_start: 10.0.1.10
    dhcp_end: 10.0.1.50
    share_internet: true
    # Czy pasażerowie w ALFA-NET mogą korzystać z internetu z telefonu
    # kierowcy (Bluetooth PAN, bnep*) — to jego pakiet danych. Sieć AA (P2P-GO)
    # nigdy nie wychodzi przez bnep* (ruch telefonu wracałby do telefonu).
    share_phone_internet: true
  # ssid_runtime / password_runtime / bssid_runtime są USTAWIANE W LOCIE przez
  # wifi_ap.py po utworzeniu grupy P2P-GO i trzymane tylko w pamięci (klucze
  # *_runtime nigdy nie są zapisywane — ani tu, ani w local.yaml). Nie wpisuj ich
  # ręcznie: Wi-Fi Direct generuje nowe SSID i hasło przy każdej grupie, a
  # nieaktualna para trafia do openauto.ini i telefon dostaje namiary na sieć,
  # która już nie istnieje. Puste = użyj ssid/password powyżej do czasu, aż AP
  # zgłosi prawdziwe wartości.
  ssid_runtime: ''
  password_runtime: ''
  bssid_runtime: ''
weather:
  # Klucz OpenWeatherMap NIE trafia do gita — podaj go w /etc/bcm/bcm.env
  # jako BCM_OWM_API_KEY (patrz config/bcm.env.example).
  api_key: ''
  poll_interval_min: 15
  # Bez GPS pogoda jest dla tego miejsca. Pierwszy fix GPS po takim
  # pobraniu wymusza od razu nowe (nie czeka do kolejnego odpytania).
  default_lat: 50.06
  default_lon: 19.94
  # Po przejechaniu tylu km od miejsca ostatniego pobrania z GPS pogoda
  # pobiera się ponownie, bez czekania na poll_interval_min (0 = wyłączone).
  refetch_distance_km: 15
travel:
  # Klucze z /etc/bcm/bcm.env: BCM_ORS_API_KEY, BCM_TOMTOM_API_KEY.
  openrouteservice_key: ''
  tomtom_key: ''
network:
  # Internet z telefonu po Bluetooth (PAN) — src/network/phone_tether.py,
  # włączany przełącznikiem modules.phone_tether. BCM zakłada w NetworkManagerze
  # profil `con_name` (typ panu) dla telefonu i podnosi go, gdy telefon jest
  # połączony po BT. Telefon musi mieć włączony „Tethering przez Bluetooth”
  # (Android potrafi go wyłączyć po restarcie telefonu) — bez tego stan
  # w Ustawieniach to „błąd” z podpowiedzią „sprawdź Tethering przez Bluetooth”
  # (albo „włącz tethering…”, gdy NM w ogóle nie widzi usługi NAP telefonu).
  # Zachowanie z wyłączonym tetheringiem NIE jest jeszcze sprawdzone w aucie:
  # nmcli -t -f DEVICE,TYPE,STATE device; nmcli connection up id bcm-phone-pan
  # Podgląd: nmcli connection show --active (szukaj bcm-phone-pan).
  phone_tether:
    # '' = telefon z bt.connected, a gdy tam brak adresu — ostatni używany
    # (multimedia.last_bt_device). Wpisz AA:BB:CC:DD:EE:FF, żeby przypiąć
    # jeden telefon (np. telefon pasażera nie dostanie wtedy profilu).
    mac: ''
    # Nazwa profilu w NetworkManagerze (litery, cyfry, _ . -).
    con_name: bcm-phone-pan
    # Metryka trasy domyślnej: 750 = domyślna NM dla Bluetooth; przyszły modem
    # LTE (NM: 700) wygra sam, telefon zostanie zapasem.
    route_metric: 750
    # Po nieudanej próbie: pierwsza ponowna po retry_sec, potem 2x dłużej.
    # Limit max_retry_sec dotyczy braku NetworkManagera / błędu profilu;
    # nieudane `connection up` (najczęściej tethering wyłączony w telefonie —
    # Android odrzuca wtedy połączenie BNEP) ponawiamy najwyżej co
    # max_retry_connected_sec, żeby po włączeniu tetheringu nie czekać 10 min.
    # Nowe połączenie BT i przycisk „Ponów” w Ustawieniach zerują licznik.
    retry_sec: 60
    max_retry_sec: 600
    max_retry_connected_sec: 120
    # Co ile sekund sprawdzać stan (pyta tylko NetworkManagera, nie radio BT).
    check_sec: 30
    # Ile sekund po połączeniu telefonu NIE ruszać BlueZ — w tym czasie
    # Android Auto wymienia po RFCOMM dane Wi-Fi Direct.
    settle_sec: 15
    # Po zestawieniu łącza uruchom raz bcm-timesync.service (zegar po odcięciu
    # prądu bywa przesunięty o godziny).
    trigger_timesync: true
    # Autoconnect profilu w NetworkManagerze. false = łącze podnosi tylko BCM
    # (po połączeniu telefonu, z settle_sec i backoffem); przy true NM sam
    # wołałby telefon, także gdy go nie ma w aucie, i w trakcie startu AA.
    autoconnect: false
  # Telefon w aucie (Redmi na USB, src/network/car_phone.py) — działa tylko
  # z modules.car_phone: true. Internet przez tethering USB (metryka 650:
  # wygrywa z Bluetooth PAN 750, a gdy kabel albo tethering padnie, kernel
  # sam wraca na PAN), GPS z aplikacji serwera NMEA w telefonie przez
  # adb forward (hardware.gps.tcp.host: auto), bateria i temperatura
  # telefonu (powiadomienie przy przegrzaniu), zegar z telefonu, gdy
  # bcm-timesync nie zadziałał w ostatnim okresie timera.
  # Serwer adb BCM słucha na gnieździe /run/bcm-adb/adb.sock (katalog tylko
  # dla roota), nie na 127.0.0.1:5037 — ręcznie zawsze przez nie:
  #   sudo env ADB_SERVER_SOCKET=localfilesystem:/run/bcm-adb/adb.sock adb …
  # (zwykłe `sudo adb …` uruchamia drugi serwer, który walczy o telefon).
  # Przygotowanie Redmi: debugowanie USB, „Always allow” przy pierwszym
  # `adb devices -l` (jak wyżej) na tym komputerze, aplikacja serwera NMEA
  # TCP na porcie gps_remote_port. adb tylko po kablu USB, nigdy `adb tcpip`.
  # Podgląd: adb devices -l (jak wyżej); nmcli connection show --active
  # (szukaj bcm-car-phone); wiersz „Telefon w aucie” w Ustawieniach.
  # Wyłączenie modułu NIE usuwa profilu bcm-car-phone (NM dalej łączy się
  # z każdym telefonem z tetheringiem USB): sudo nmcli connection delete
  # bcm-car-phone. Szczegóły: docs/WDROZENIE_TESTOWE.md §5.7.
  car_phone:
    # '' = jedyny telefon na USB w stanie „device”. Przy dwóch urządzeniach
    # wpisz serial z `adb devices -l` (najlepiej w config/local.yaml).
    serial: ''
    con_name: bcm-car-phone
    route_metric: 650
    # svc_usb = BCM włącza tethering USB przez adb (svc usb setFunctions);
    # none = tethering włącza sam telefon („Default USB configuration”).
    tether_method: svc_usb
    usb_function: rndis      # rndis albo ncm
    check_sec: 30
    retry_sec: 15
    max_retry_sec: 300
    # Po włączeniu tetheringu USB telefon łączy się ponownie — tyle sekund
    # czekamy, zanim sprawdzimy wynik.
    settle_sec: 10
    gps_forward: true
    gps_remote_port: 50000   # port serwera NMEA TCP w telefonie
    # Lokalny port forwardu GPS (0 = hardware.gps.tcp.port). Celowo < 1024,
    # jak czujniki i agent niżej: prędkość z GPS decyduje o wykrywaniu
    # stłuczki, więc kiosk nie może zająć tego portu przed adb i podawać
    # fałszywej prędkości.
    gps_local_port: 950
    # Forward czujników (SensorServer) — tylko z modules.phone_sensors —
    # i agenta Termux — tylko z modules.car_phone_agent. Porty lokalne
    # celowo < 1024: nasłuch na nich może założyć tylko root (serwer adb),
    # więc użytkownik kiosku nie podstawi fałszywego akcelerometru ani
    # agenta. Każdy lokalny proces może się jednak z nimi POŁĄCZYĆ (SensorServer
    # nie ma uwierzytelniania; agent musi mieć HMAC). Porty muszą się różnić
    # od siebie, od portu GPS i od 5002/5003.
    sensors_remote_port: 8080  # port SensorServer w telefonie
    sensors_local_port: 951
    agent_remote_port: 8765    # port agenta Termux w telefonie (plan F)
    agent_local_port: 952
    # Sekret HMAC agenta (network.car_phone.agent.secret) TYLKO w
    # /etc/bcm/bcm.env jako BCM_CAR_PHONE_AGENT_SECRET — nigdy tutaj ani
    # w local.yaml.
    battery_sec: 60
    # Ostrzeżenie / alarm przy temperaturze baterii (°C); alarm gaśnie
    # dopiero poniżej warn_temp_c − 3.
    warn_temp_c: 45
    critical_temp_c: 50
    trigger_timesync: true
    # Czas z telefonu (kabel jest zaufany, w przeciwieństwie do NMEA po UDP):
    # tylko gdy bcm-timesync nie zadziałał w ostatnim okresie timera
    # (1 h + 15 min) i dryf zegara przekracza time_sync_drift_s sekund.
    # Nigdy z zegara bliższego niż 48 h dacie zbudowania ROM-u (tak startuje
    # telefon, który stracił czas), a cofnięcie o ponad 1 h dopiero, gdy
    # drugi odczyt 10 min później pokaże ten sam dryf.
    time_sync: true
    time_sync_drift_s: 30
power:
  shutdown_delay_seconds: 30
  backlight_fade_ms: 1000
  standby_max_hours: 24
  splash_duration_seconds: 15
  ignition_watcher:
    gpio_chip: gpiochip0
    ignition_line: 7
    bench_button_line: 21
    debounce_ms: 200
    active_low: true
    autostart: true
    suspend_on_stop: true
    suspend_delay_seconds: 5
arduino:
  # Port sensor huba (Nano z arduino/sensor_hub: drzwi, zapłon, PWR:, BATT:).
  # '' = brak stałej ścieżki. Docelowo /dev/ttyBCM_SENSOR z reguły
  # config/udev/99-bcm-sensor-hub.rules (szablon — wpisz w nią ID_PATH
  # gniazda) albo /dev/serial/by-path/…; tu bez sensor huba w aucie.
  sensor_hub_port: ''
  # Gdy sensor_hub_port jest pusty: true = stare zachowanie (otwiera po kolei
  # /dev/ttyACM0..1 i /dev/ttyUSB0..2, pierwszy, który się otworzy, wygrywa).
  # Wyłączone, bo samo otwarcie portu ustawia DTR i RESETUJE każde Nano na
  # CH340, a sondowanie może zająć port adaptera K-Line, GPS albo zamka
  # (porty WŁĄCZONYCH modułów są pomijane, także przy każdym ponownym
  # otwarciu; port GPS tylko, gdy hardware.gps.source go czyta — serial albo
  # auto poza x86; porty wyłączonych modułów — nie). Skutek:
  # bez sensor_hub_port BCM nie czyta Arduino przez port szeregowy wcale —
  # przyciski SWC z Pro Micro idą przez USB HID i działają dalej; nie jest
  # czytany tylko LIGHT: z Pro Micro (dziś nic z niego nie korzysta).
  probe_ports: false
battery:
  # Monitor banku buforowego 12 V AGM (src/power/battery.py), progi z
  # docs/ZASILANIE_BUFOROWANE.md §13.4. Działa tylko z modules.battery: true
  # i sensor hubem skompilowanym z FEATURE_BATT_ADC albo FEATURE_BATT_INA226
  # (komunikat BATT:<mV>[,<mA>]) — w tym wariancie testowym jest wyłączony.
  # Stan: charging | full | ok | low | critical | unknown. BCM sam niczego
  # nie wyłącza — od tego jest sprzętowe LVD (11,0 V).
  full_v: 12.85              # spoczynkowe napięcie pełnego banku
  nominal_v: 12.40           # ok. połowa pojemności (tylko punkt odniesienia)
  low_v: 11.80               # poniżej: battery.low
  critical_v: 11.20          # poniżej: battery.critical (nad progiem LVD)
  hysteresis_v: 0.10         # „low” trwa, dopóki napięcie nie wróci > low_v + 0,10
  charging_v: 13.20          # powyżej: ładowanie (żaden bank tyle nie trzyma w spoczynku)
  charging_current_a: 0.2    # albo prąd do banku > 0,2 A (tylko z INA226)
  current_sign: 1            # -1, gdy bocznik wpięty odwrotnie (ładowanie < 0)
  smoothing_samples: 5       # mediana z 5 odczytów (BATT: co 2 s)
  stale_sec: 30              # tyle bez BATT: → stan unknown
rain_sensor:
  sensitivity: medium
central_lock:
  port: /dev/ttyUSB1
  baudrate: 9600
lighting:
  follow_me_home_seconds: 60
  greeting_blinks: 2
  leaving_home: true
traffic:
  api_key: ''
  provider: tomtom
  poll_interval_min: 5
remote_status:
  api_key: ''
alarm:
  siren_duration: 60
  arming_delay: 30
  sensors:
    door: true
    motion: true
    tilt: true
    shock: true
# Wykrywanie stłuczki (modules.crash_detect; src/safety/crash_detect.py).
# Zdarzenie z akcelerometru telefonu (phone_sensors), gdy: najwyższa prędkość
# z GPS w ostatnich 10 s ≥ min_speed_kmh, zmiana prędkości w poziomie
# ≥ dv_threshold_kmh w ciągu dv_window_ms i ≥ g_h_threshold g przez ≥ 3 kolejne
# próbki. Odrzuca dziury (przewaga pionu, tylko gdy nic nie dobiło do zakresu
# akcelerometru), upadek telefonu (swobodny spadek ≥ 80 ms, z żyroskopem też
# z obrotem), brak kalibracji, strumień < min_rate_hz, odrzucone ramki i dane
# starsze niż 1 s. Bez żadnej prędkości z GPS (tunel) — zapis i ochrona
# nagrania, ale bez prawa do SMS. Jeśli auto jedzie dalej (> min_speed_kmh
# przez 10 s) — odwołane; prędkość ≤ confirm_stop_kmh — potwierdzone
# zatrzymanie. Zdarzenie pokazuje też powiadomienie na ekranie. Zapis:
# data/crash_events (50 ostatnich). Stare klucze speed_drop_threshold /
# g_force_threshold / post_crash_record_sec nie są już czytane.
crash_detection:
  min_speed_kmh: 25
  dv_threshold_kmh: 15
  dv_window_ms: 150
  g_h_threshold: 4.0
  min_rate_hz: 80
  confirm_stop_kmh: 5
  # SMS po stłuczce (modules.crash_sms, src/safety/crash_sms.py; włącznikiem
  # jest TYLKO ten przełącznik — tu nie ma klucza „enabled”). Po uderzeniu
  # BCM od razu uzbraja agenta w telefonie i pokazuje okno z odliczaniem
  # (ANULUJ – nic się nie stało / Wyślij teraz); od tej chwili termin
  # trzyma TELEFON — wyśle SMS także wtedy, gdy BCM padnie. Część ustawień
  # BCM przy każdej zmianie wysyła do agenta (modules.car_phone_agent).
  # Odbiorców NIE wpisuj tutaj: Ustawienia → „SMS po stłuczce” (zapis do
  # config/local.yaml), numery E.164 (np. '+48601234567'), najwyżej 3.
  # dry_run: true = SMS-y o wypadku i odwołujące agent tylko loguje (nic nie
  # wysyła); wyjątek: „Wyślij testowy SMS” w Ustawieniach (prawdziwy test,
  # po potwierdzeniu na ekranie auta). dry_run: false działa dopiero, gdy:
  # agent jest sparowany i zdrowy, testowy SMS był potwierdzony w wysłanych
  # w ciągu 30 dni, czujniki telefonu dają ≥ min_rate_hz i są skalibrowane —
  # inaczej wymuszony tryb testowy z powodem w oknie i w Ustawieniach.
  # Prawdziwe alarmy dopiero po sprawdzeniach na stole
  # (docs/WDROZENIE_TESTOWE.md §5.9).
  # countdown_sec: odliczanie w oknie (15–120 s). cooldown_min / max_per_day:
  # limit BCM (telefon ma też własny: 1 na 10 min, 3 na dobę).
  # vehicle_label: nazwa auta na początku SMS-a (A-Z a-z 0-9 spacja . -,
  # najwyżej 20 znaków, bez polskich liter). follow_up_cancel: po „Jestem OK”
  # jeden SMS odwołujący do tych, którzy dostali alarm (w ciągu 15 min).
  sms:
    dry_run: true
    countdown_sec: 45
    sim_slot: 0
    vehicle_label: ALFA 156
    cooldown_min: 10
    max_per_day: 3
    follow_up_cancel: true
# Czujniki telefonu w aucie (modules.phone_sensors; src/sensors/phone_sensors.py).
# Kierunek grawitacji kalibruje się sam przy pierwszych ~10 s postoju
# (zapis: data/phone_sensors.json); przesunięcie telefonu w uchwycie o > 10°
# na dłużej (albo o > 20° od razu) wyłącza calib_ok (wtedy brak wykrywania
# z akcelerometru). Ponowna kalibracja po przełożeniu telefonu: usuń
# data/phone_sensors.json i zrestartuj BCM. Progi crash_detection
# nieosiągalne dla tego zakresu — jedno ostrzeżenie w logu przy starcie.
sensors:
  phone:
    # Zakres akcelerometru telefonu w g (sprawdź: adb shell dumpsys
    # sensorservice) — ≥ 98% zakresu oznacza nasycenie (pole sat).
    accel_range_g: 8
tracking:
  db_path: data/gps_tracks.db
  # Punkt trasy co 5 s (produkcja: 30 s) — dokładniejszy ślad w GPX.
  interval_sec: 5
  trip_start_kmh: 5
  trip_end_kmh: 2
  trip_end_idle_sec: 60
  # Trasa zamyka się sama po tylu sekundach bez pozycji z GPS (telefon
  # wyszedł z auta, aplikacja GPS przestała wysyłać).
  no_fix_close_sec: 300
  lte_sync_min: 15
  geofence_lat: 0
  geofence_lon: 0
  geofence_radius_km: 0
multimedia:
  # Ustawiane w locie przy połączeniu BT i zapisywane do config/local.yaml.
  last_bt_device: ''
  # Rozdzielczość projekcji AA: 480p / 720p / 1080p (puste = automat, który
  # dla płótna 1024x504 i tak wybiera 720p). 720p jest sprawdzone w aucie.
  aa_resolution: 720p
  # Wyjście audio autoapp ([Audio] OutputBackendType w openauto.ini):
  # qt | rtaudio. RtAudio (domyślne w kodzie) przy pustym buforze gra w kółko
  # ostatnie ~50 ms, gdy asystent zabierze fokus = "zawieszenie + brzęczenie";
  # Qt naprawdę wstrzymuje wyjście. Powrót: rtaudio i restart AA.
  aa_audio_backend: qt
  # Jak przycisk głosu uruchamia asystenta AA: key = klawisz M na :99
  # (autoapp: MICROPHONE_1, wymaga mikrofonu przy starcie AA), tap = stuknięcie
  # w ikonę mikrofonu (stare zachowanie, fallback).
  aa_voice_method: key
  # [Input] openauto.ini: true = autoapp zgłasza telefonowi przyciski
  # (play/pauza/następny, D-pad, pokrętło, wstecz/OK…; klucze *Button openDsh).
  # BCM dziś wysyła do AA tylko M (głos), więc to przygotowanie pod SWC.
  # Domyślnie w kodzie false = produkcja bez zmian (żaden przycisk).
  aa_input_buttons: true
bluetooth:
  enabled: true
  preferred_adapter: ''
  # Ile sekund po połączeniu telefonu odczekać przed pobraniem kontaktów
  # (PBAP = sesja OBEX po RFCOMM). W tym czasie Android Auto wymienia po
  # RFCOMM dane Wi-Fi Direct — tyle samo co network.phone_tether.settle_sec.
  # Domyślnie w kodzie 3 s (produkcja bez zmian).
  phonebook_settle_sec: 15
  # Stan telefonu w pasku (modules.phone_status): odczyt z oFono/BlueZ co
  # poll_sec sekund, gdy telefon jest połączony (i od razu po połączeniu).
  # Odczyt z pamięci oFono/BlueZ (telefon sam przysyła zmiany); tylko
  # pierwszy odczyt Handsfree po połączeniu HFP wysyła do telefonu jedno
  # AT+CNUM.
  # Gdy nie odpowiada ani oFono, ani BlueZ: kolejna próba po retry_sec.
  phone_status:
    poll_sec: 20
    retry_sec: 120
