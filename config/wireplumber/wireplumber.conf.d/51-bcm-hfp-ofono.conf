# BCM: use ofono as the HFP backend instead of PipeWire's native one.
#
# The native backend handles HFP *audio* but exposes no dial/answer/hangup
# API, so the dashboard dialer (which calls org.ofono.VoiceCallManager via
# bluetooth.py) could never actually place a call. Pointing the backend at
# ofono lets ofono own HFP call-control while still coordinating SCO audio
# with PipeWire. Revert by removing this file + restarting wireplumber.
#
# The oFono backend only works if WirePlumber (running as the kiosk user)
# may register oFono's HandsfreeAudioAgent on the system bus — that is
# /etc/dbus-1/system.d/bcm-ofono-pipewire.conf, installed by setup-x86.sh /
# apply-fixes.sh. Without it the journal shows "Register() failed" /
# "oFono not available" and calls never reach the head unit.
#
# Syntax: WirePlumber >= 0.5 (SPA-JSON drop-in). 0.4 ignores this file.
monitor.bluez.properties = {
  bluez5.hfphsp-backend = "ofono"

  # Wideband speech (mSBC) pinned OFF. To be honest about what this does:
  # with the oFono backend, PipeWire 1.4 already negotiates only narrowband
  # CVSD unless mSBC is enabled, so today this changes nothing — it is an
  # explicit pin, so that a future PipeWire/WirePlumber default cannot
  # silently switch the call codec under us. mSBC over the MT7921's shared
  # radio is untested in the car; re-enable only after a call test with
  # `btmon` showing clean SCO/eSCO packets (no errors, no drops).
  bluez5.enable-msbc = false
}
