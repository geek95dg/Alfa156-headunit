<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="900" viewBox="0 0 1180 900" font-family="DejaVu Sans, Verdana, sans-serif">
  <title>BCM v8.5 — Ładowanie banku żelowego, blokada przeładowania i LVD</title>
  <style>
    .bg   { fill: #ffffff; }
    .box  { fill: #f7f9fb; stroke: #2b3a45; stroke-width: 2; rx: 6; }
    .boxW { fill: #fdf3e6; stroke: #a8621a; stroke-width: 2; rx: 6; }
    .boxA { fill: #eef7ee; stroke: #2d6a2d; stroke-width: 2; rx: 6; }
    .wire { stroke: #c0392b; stroke-width: 3; fill: none; }
    .ctrl { stroke: #2b4a8a; stroke-width: 1.8; fill: none; stroke-dasharray: 5 3; }
    .ttl  { font-size: 19px; font-weight: bold; fill: #10202b; }
    .sub  { font-size: 12px; fill: #5a6b78; }
    .h    { font-size: 13px; font-weight: bold; fill: #10202b; text-anchor: middle; }
    .t    { font-size: 11px; fill: #33424e; text-anchor: middle; }
    .tl   { font-size: 11px; fill: #33424e; }
    .tb   { font-size: 11px; font-weight: bold; fill: #10202b; }
    .note { font-size: 10.5px; fill: #6a7a86; }
    .warn { font-size: 11px; font-weight: bold; fill: #a8321a; }
    .axis { stroke: #7b8b96; stroke-width: 1.5; fill: none; }
    .cv   { stroke: #2b4a8a; stroke-width: 2.5; fill: none; }
    .cc   { stroke: #c0392b; stroke-width: 2.5; fill: none; }
  </style>

  <rect class="bg" x="0" y="0" width="1180" height="900"/>
  <text class="ttl" x="24" y="32">Ładowanie banku żelowego, blokada przeładowania i odcięcie LVD</text>
  <text class="sub" x="24" y="52">Trzy niezależne warstwy ochrony: profil ładowania CC-CV · rozłącznik nadnapięciowy · rozłącznik podnapięciowy</text>
  <line x1="24" y1="62" x2="1156" y2="62" stroke="#c8d2da" stroke-width="1.5"/>

  <!-- ===== CHAIN ===== -->
  <rect class="box" x="30" y="90" width="182" height="92"/>
  <text class="h" x="121" y="112">Wejście 12 V z auta</text>
  <text class="t" x="121" y="132">silnik pracuje: 13,8–14,5 V</text>
  <text class="t" x="121" y="150">postój: 12,4–12,7 V</text>
  <text class="t" x="121" y="168">po bezp. 30 A</text>

  <path class="wire" d="M212 136 L262 136"/>

  <rect class="box" x="262" y="90" width="196" height="92"/>
  <text class="h" x="360" y="112">WARSTWA 0 — rozdział</text>
  <text class="t" x="360" y="132">VSR: zwiera przy 13,3 V,</text>
  <text class="t" x="360" y="150">rozwiera przy 12,8 V</text>
  <text class="t" x="360" y="168">ładowanie tylko przy alternatorze</text>

  <path class="wire" d="M458 136 L508 136"/>

  <rect class="box" x="508" y="90" width="216" height="92"/>
  <text class="h" x="616" y="112">WARSTWA 1 — ładowarka</text>
  <text class="t" x="616" y="132">CC-CV buck-boost</text>
  <text class="t" x="616" y="150">6 A / 14,20 V / 13,70 V</text>
  <text class="t" x="616" y="168">profil GEL + komp. temp.</text>

  <path class="wire" d="M724 136 L774 136"/>

  <rect class="boxW" x="774" y="90" width="216" height="92"/>
  <text class="h" x="882" y="112">WARSTWA 2 — nadnapięcie</text>
  <text class="t" x="882" y="132">rozłącznik 14,60 V</text>
  <text class="t" x="882" y="150">powrót przy 13,60 V</text>
  <text class="t" x="882" y="168">niezależny od ładowarki</text>

  <path class="wire" d="M882 182 L882 214 L616 214 L616 246"/>

  <rect class="boxA" x="470" y="246" width="292" height="86"/>
  <text class="h" x="616" y="268">Bank żelowy 5 × 12 V / 5 Ah = 25 Ah</text>
  <text class="t" x="616" y="288">VRLA GEL, praca buforowa, 25 °C</text>
  <text class="t" x="616" y="306">bezpiecznik 10 A na każdym pakiecie</text>
  <text class="t" x="616" y="324">czujnik NTC przyklejony do obudowy</text>

  <path class="wire" d="M616 332 L616 364"/>

  <rect class="boxW" x="470" y="364" width="292" height="86"/>
  <text class="h" x="616" y="386">WARSTWA 3 — LVD (podnapięcie)</text>
  <text class="t" x="616" y="406">rozłącza przy 11,00 V</text>
  <text class="t" x="616" y="424">powrót przy 12,60 V (histereza!)</text>
  <text class="t" x="616" y="442">przekaźnik 30 A, pobór własny &lt; 10 mA</text>

  <path class="wire" d="M616 450 L616 486"/>
  <text class="tb" x="640" y="474">→ domena A + domena B</text>

  <!-- NTC control line -->
  <path class="ctrl" d="M470 290 L436 290 L436 200 L616 200 L616 182"/>
  <text class="note" x="300" y="286">NTC → kompensacja</text>
  <text class="note" x="300" y="300">temperaturowa ładowarki</text>

  <!-- ===== SETPOINT TABLE ===== -->
  <rect x="30" y="500" width="540" height="342" fill="#fbfcfd" stroke="#c8d2da" stroke-width="1.5" rx="6"/>
  <text class="h" x="300" y="524">Nastawy — akumulator ŻELOWY (GEL), bank 25 Ah</text>

  <line x1="46" y1="536" x2="554" y2="536" stroke="#c8d2da"/>
  <text class="tb" x="52" y="556">Parametr</text>
  <text class="tb" x="330" y="556">Wartość</text>
  <text class="tb" x="486" y="556">Warstwa</text>
  <line x1="46" y1="564" x2="554" y2="564" stroke="#c8d2da"/>

  <text class="tl" x="52" y="584">Prąd ładowania (CC)</text>
  <text class="tl" x="330" y="584">6,0 A  (0,24 C)</text>
  <text class="tl" x="486" y="584">1</text>

  <text class="tl" x="52" y="604">Napięcie absorpcji (CV)</text>
  <text class="tl" x="330" y="604">14,20 V @ 25 °C</text>
  <text class="tl" x="486" y="604">1</text>

  <text class="tl" x="52" y="624">Napięcie podtrzymania (float)</text>
  <text class="tl" x="330" y="624">13,70 V @ 25 °C</text>
  <text class="tl" x="486" y="624">1</text>

  <text class="tl" x="52" y="644">Kompensacja temperaturowa</text>
  <text class="tl" x="330" y="644">−20 mV/°C</text>
  <text class="tl" x="486" y="644">1</text>

  <text class="tl" x="52" y="664">Twardy próg przeładowania</text>
  <text class="tl" x="330" y="664">14,60 V — rozwarcie</text>
  <text class="tl" x="486" y="664">2</text>

  <text class="tl" x="52" y="684">Powrót po nadnapięciu</text>
  <text class="tl" x="330" y="684">13,60 V</text>
  <text class="tl" x="486" y="684">2</text>

  <text class="tl" x="52" y="704">Odcięcie LVD</text>
  <text class="tl" x="330" y="704">11,00 V</text>
  <text class="tl" x="486" y="704">3</text>

  <text class="tl" x="52" y="724">Powrót po LVD</text>
  <text class="tl" x="330" y="724">12,60 V</text>
  <text class="tl" x="486" y="724">3</text>

  <line x1="46" y1="738" x2="554" y2="738" stroke="#c8d2da"/>
  <text class="warn" x="52" y="758">GEL ≠ AGM — 14,4 V to już za dużo dla żelu.</text>
  <text class="note" x="52" y="776">Przekroczenie ~14,4 V trwale wytwarza pęcherze gazu w elektrolicie żelowym; ubytek</text>
  <text class="note" x="52" y="792">pojemności jest nieodwracalny. Dla AGM 14,4–14,7 V jest normą — stąd rozbieżność</text>
  <text class="note" x="52" y="808">wobec starszych notatek w repo, pisanych pod AGM.</text>
  <text class="note" x="52" y="830">Ładowanie prądem &gt; 0,3 C (7,5 A dla 25 Ah) skraca żywotność żelu — stąd limit 6 A.</text>

  <!-- ===== TEMP COMPENSATION TABLE ===== -->
  <rect x="596" y="500" width="270" height="212" fill="#fbfcfd" stroke="#c8d2da" stroke-width="1.5" rx="6"/>
  <text class="h" x="731" y="524">Napięcie vs temperatura</text>
  <line x1="612" y1="534" x2="850" y2="534" stroke="#c8d2da"/>
  <text class="tb" x="618" y="554">Temp.</text>
  <text class="tb" x="700" y="554">Absorpcja</text>
  <text class="tb" x="790" y="554">Float</text>
  <line x1="612" y1="562" x2="850" y2="562" stroke="#c8d2da"/>
  <text class="tl" x="618" y="582">−10 °C</text><text class="tl" x="700" y="582">14,90 V</text><text class="tl" x="790" y="582">14,40 V</text>
  <text class="tl" x="618" y="602">0 °C</text><text class="tl" x="700" y="602">14,70 V</text><text class="tl" x="790" y="602">14,20 V</text>
  <text class="tl" x="618" y="622">+15 °C</text><text class="tl" x="700" y="622">14,40 V</text><text class="tl" x="790" y="622">13,90 V</text>
  <text class="tl" x="618" y="642">+25 °C</text><text class="tl" x="700" y="642">14,20 V</text><text class="tl" x="790" y="642">13,70 V</text>
  <text class="tl" x="618" y="662">+40 °C</text><text class="tl" x="700" y="662">13,90 V</text><text class="tl" x="790" y="662">13,40 V</text>
  <text class="note" x="618" y="686">Bagażnik latem osiąga 45–55 °C — bez</text>
  <text class="note" x="618" y="698">kompensacji bank jest stale przeładowywany.</text>

  <!-- ===== CC-CV CURVE ===== -->
  <rect x="596" y="716" width="554" height="126" fill="#fbfcfd" stroke="#c8d2da" stroke-width="1.5" rx="6"/>
  <text class="h" x="873" y="736">Przebieg ładowania CC → CV → float</text>
  <path class="axis" d="M630 822 L1120 822"/>
  <path class="axis" d="M630 822 L630 748"/>
  <path class="cc" d="M630 800 L760 800"/>
  <path class="cc" d="M760 800 C 800 800, 830 812, 900 818 L1110 820"/>
  <path class="cv" d="M630 812 C 700 790, 740 768, 762 762 L900 762"/>
  <path class="cv" d="M900 762 L920 776 L1110 776"/>
  <text class="note" x="666" y="816">prąd 6 A (CC)</text>
  <text class="note" x="666" y="756">napięcie rośnie</text>
  <text class="note" x="790" y="756">14,20 V — absorpcja</text>
  <text class="note" x="945" y="770">13,70 V — float</text>
  <text class="note" x="930" y="812">prąd maleje</text>
  <text class="note" x="630" y="838">czas →</text>
  <text class="note" x="820" y="838">przejście do float po spadku prądu &lt; 0,05 C (1,25 A)</text>

  <text class="note" x="24" y="878">Warstwy 2 i 3 muszą działać niezależnie od ładowarki — jeżeli ładowarka utknie w stanie przewodzenia, warstwa 2 jest jedyną rzeczą chroniącą bank przed rozerwaniem.</text>
</svg>
