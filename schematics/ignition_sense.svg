  <text class="lbl" x="450" y="118" text-anchor="end">10 kΩ (opc.)</text>
  <line class="wp" x1="504" y1="84" x2="504" y2="76"/>
  <line class="wp" x1="452" y1="76" x2="556" y2="76"/>
