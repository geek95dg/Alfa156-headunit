<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1140" viewBox="0 0 1180 1140" font-family="DejaVu Sans, Verdana, sans-serif">
  <title>BCM v8.5 — Zasilanie buforowane Lenovo M910q (tor główny)</title>
  <style>
    .bg   { fill: #ffffff; }
    .box  { fill: #f7f9fb; stroke: #2b3a45; stroke-width: 2; rx: 6; }
    .boxA { fill: #eef7ee; stroke: #2d6a2d; stroke-width: 2; rx: 6; }
    .boxB { fill: #eef2fa; stroke: #2b4a8a; stroke-width: 2; rx: 6; }
    .boxW { fill: #fdf3e6; stroke: #a8621a; stroke-width: 2; rx: 6; }
    .batt { fill: #fffaf0; stroke: #6b4a12; stroke-width: 2; rx: 4; }
    .wire { stroke: #c0392b; stroke-width: 3; fill: none; }
    .wthin{ stroke: #2b3a45; stroke-width: 1.6; fill: none; }
    .gnd  { stroke: #444; stroke-width: 2.2; fill: none; }
    .ttl  { font-size: 19px; font-weight: bold; fill: #10202b; }
    .sub  { font-size: 12px; fill: #5a6b78; }
    .h    { font-size: 13px; font-weight: bold; fill: #10202b; text-anchor: middle; }
    .t    { font-size: 11px; fill: #33424e; text-anchor: middle; }
    .tl   { font-size: 11px; fill: #33424e; }
    .note { font-size: 10.5px; fill: #6a7a86; }
    .warn { font-size: 11px; font-weight: bold; fill: #a8321a; }
    .dom  { font-size: 12px; font-weight: bold; }
  </style>

  <rect class="bg" x="0" y="0" width="1180" height="1140"/>
  <text class="ttl" x="24" y="32">BCM v8.5 — zasilanie buforowane, Lenovo ThinkCentre M910q Tiny</text>
  <text class="sub" x="24" y="52">Tor główny: akumulator samochodowy → ładowanie CC-CV → bank CSB HR1221W (AGM) → LVD → domeny A/B → step-up 19 V</text>
  <line class="wthin" x1="24" y1="62" x2="1156" y2="62" stroke="#c8d2da"/>

  <!-- ============ 1. CAR BATTERY ============ -->
  <rect class="batt" x="60" y="86" width="230" height="62"/>
  <text class="h" x="175" y="110">Akumulator rozruchowy 12 V</text>
  <text class="t" x="175" y="128">Alfa 156 — alternator 120 A</text>
  <text class="t" x="175" y="142">13,8–14,5 V przy pracy silnika</text>

  <path class="wire" d="M175 148 L175 186"/>

  <!-- 2. MAIN FUSE -->
  <rect class="boxW" x="60" y="186" width="230" height="56"/>
  <text class="h" x="175" y="208">Bezpiecznik główny 30 A</text>
  <text class="t" x="175" y="226">maks. 30 cm od klemy „+”, 6 mm²</text>

  <path class="wire" d="M175 242 L175 280"/>

  <!-- 3. SPLIT CHARGE -->
  <rect class="box" x="40" y="280" width="270" height="86"/>
  <text class="h" x="175" y="302">Rozdział ładowania</text>
  <text class="t" x="175" y="320">Przekaźnik 30 A z zapłonu + dioda MBR2545CT</text>
  <text class="t" x="175" y="336">— albo dioda Schottky MBR2045 —</text>
  <text class="t" x="175" y="352">blokuje oddawanie prądu do auta</text>

  <path class="wire" d="M175 366 L175 404"/>

  <!-- 4. CC-CV CHARGER -->
  <rect class="box" x="40" y="404" width="270" height="112"/>
  <text class="h" x="175" y="426">Ładowarka CC-CV (buck-boost)</text>
  <text class="t" x="175" y="444">CC: 8,0 A  (sufit katalogowy 14,7 A)</text>
  <text class="t" x="175" y="460">CV absorpcja: 14,40 V @ 25 °C</text>
  <text class="t" x="175" y="476">float: 13,65 V @ 25 °C</text>
  <text class="t" x="175" y="494">komp. −30 mV/°C abs. / −18 mV/°C float</text>
  <text class="warn" x="175" y="510" text-anchor="middle">PROFIL AGM</text>

  <path class="wire" d="M175 516 L175 554"/>

  <!-- 5. OVERCHARGE CUTOFF -->
  <rect class="boxW" x="40" y="554" width="270" height="86"/>
  <text class="h" x="175" y="576">Blokada przeładowania</text>
  <text class="t" x="175" y="594">XH-M603 (2. warstwa) — styki ≤ 8,0 A</text>
  <text class="t" x="175" y="610">rozwiera przy 15,30 V</text>
  <text class="t" x="175" y="626">zwiera ponownie przy 14,00 V</text>

  <path class="wire" d="M175 640 L175 678"/>

  <!-- 6. BUFFER BUS + AGM BANK -->
  <rect class="boxA" x="40" y="678" width="270" height="222"/>
  <text class="h" x="175" y="700">Szyna bufora 12 V — bank AGM</text>
  <text class="t" x="175" y="718">7 × CSB HR1221W F2 (12 V / 5,1 Ah)</text>
  <text class="t" x="175" y="734">35,7 Ah · 12,6 kg · układ 4+3</text>

  <g>
    <rect class="batt" x="82" y="742" width="42" height="30"/><text class="t" x="103" y="762">5,1 Ah</text>
    <rect class="batt" x="130" y="742" width="42" height="30"/><text class="t" x="151" y="762">5,1 Ah</text>
    <rect class="batt" x="178" y="742" width="42" height="30"/><text class="t" x="199" y="762">5,1 Ah</text>
    <rect class="batt" x="226" y="742" width="42" height="30"/><text class="t" x="247" y="762">5,1 Ah</text>
    <rect class="batt" x="106" y="776" width="42" height="30"/><text class="t" x="127" y="796">5,1 Ah</text>
    <rect class="batt" x="154" y="776" width="42" height="30"/><text class="t" x="175" y="796">5,1 Ah</text>
    <rect class="batt" x="202" y="776" width="42" height="30"/><text class="t" x="223" y="796">5,1 Ah</text>
  </g>
  <text class="t" x="175" y="824">szyna: 2 płaskowniki Cu 15 × 2 mm</text>
  <text class="t" x="175" y="840">7 odczepów co 70 mm · ogonki równe</text>
  <text class="warn" x="175" y="858" text-anchor="middle">ODBIÓR PO PRZEKĄTNEJ</text>
  <text class="t" x="175" y="874">„+” z odczepu 1, „−” z odczepu 7</text>
  <text class="t" x="175" y="890">FB1…FB7 — po 10 A na każdy pakiet</text>

  <path class="wire" d="M175 900 L175 920"/>

  <!-- 7. LVD -->
  <rect class="boxW" x="40" y="920" width="270" height="80"/>
  <text class="h" x="175" y="942">LVD — moduł XH-M609</text>
  <text class="t" x="175" y="960">rozłącza obciążenia przy 11,00 V</text>
  <text class="t" x="175" y="976">załącza ponownie przy 12,60 V</text>
  <text class="t" x="175" y="992">przekaźnik 20 A · F7 15 A MIDI na VIN+</text>

  <!-- bus out to the right -->
  <path class="wire" d="M175 1000 L175 1036 L700 1036"/>
  <text class="tl" x="330" y="1028">szyna buforowana 12 V (za LVD)</text>

  <!-- ============ RIGHT COLUMN: DOMAINS ============ -->
  <text class="dom" x="430" y="96" fill="#2d6a2d">DOMENA A — zasilana zawsze</text>
  <rect class="boxA" x="430" y="106" width="300" height="196"/>
  <text class="t" x="580" y="128">pobór spoczynkowy ~60 mA</text>
  <text class="tl" x="446" y="150">• Arduino Nano #1 (output controller)</text>
  <text class="tl" x="446" y="170">• HM-10 BLE (bramkowanie bagażnika)</text>
  <text class="tl" x="446" y="190">• RXB6 433 MHz (pilot szyb)</text>
  <text class="tl" x="446" y="210">• moduł 9 przekaźników (cewki 12 V)</text>
  <text class="tl" x="446" y="230">• Arduino Nano #2 (sensor hub)</text>
  <text class="t" x="580" y="256">zasilanie logiki: buck 12 → 5 V, 1 A</text>
  <text class="t" x="580" y="274">bezpiecznik odgałęzienia 3 A</text>
  <text class="t" x="580" y="292">przewód 0,75 mm²</text>

  <text class="dom" x="430" y="336" fill="#2b4a8a">DOMENA B — za zapłonem (ACC)</text>
  <rect class="boxB" x="430" y="346" width="300" height="150"/>
  <text class="tl" x="446" y="370">• Lenovo M910q (19 V, do 65 W)</text>
  <text class="tl" x="446" y="390">• hub USB zasilany 7-portowy</text>
  <text class="tl" x="446" y="410">• wyświetlacz główny 10,1"</text>
  <text class="tl" x="446" y="430">• wyświetlacz drugi 6,86" (opc.)</text>
  <text class="tl" x="446" y="450">• Arduino Pro Micro (wejścia, SWC)</text>
  <text class="t" x="580" y="474">pobór ~10 W (szczyt ~55 W)</text>
  <text class="t" x="580" y="490">0 W przy rozwartym przekaźniku</text>

  <!-- Domain A feed -->
  <path class="wire" d="M700 1036 L760 1036 L760 264 L730 264"/>
  <path class="wire" d="M760 264 L760 204 L730 204"/>
  <circle cx="760" cy="264" r="4" fill="#c0392b"/>

  <!-- Ignition relay -->
  <rect class="box" x="800" y="560" width="330" height="104"/>
  <text class="h" x="965" y="582">Wyłącznik główny (szyna odbiorników)</text>
  <text class="t" x="965" y="600">Bosch 12 V / 30 A SPDT</text>
  <text class="t" x="965" y="618">cewka: linia ACC (kluczyk poz. I/II)</text>
  <text class="t" x="965" y="636">styk: szyna buforowana → step-up</text>
  <text class="t" x="965" y="654">dioda gaszeniowa 1N4007 na cewce</text>

  <path class="wire" d="M760 1036 L965 1036 L965 664"/>
  <circle cx="760" cy="1036" r="4" fill="#c0392b"/>
  <path class="wthin" d="M965 700 L1080 700" stroke-dasharray="4 3"/>
  <text class="note" x="985" y="694">ACC z zamka kluczyka</text>

  <!-- Step-up -->
  <rect class="boxB" x="800" y="404" width="330" height="128"/>
  <text class="h" x="965" y="426">Przetwornica step-up XL6019</text>
  <text class="t" x="965" y="446">POSIADANA · 12 → 19,5 V</text>
  <text class="t" x="965" y="464">wyjście 19,0 V ustawione multimetrem</text>
  <text class="t" x="965" y="482">realnie ok. 45 W (limit klucza 5 A)</text>
  <text class="t" x="965" y="500">wymaga limitu poboru CPU na M910q</text>
  <text class="t" x="965" y="518">radiator + wymuszony przepływ powietrza</text>

  <path class="wire" d="M965 560 L965 532"/>

  <!-- fuse on step-up output -->
  <rect class="boxW" x="838" y="330" width="254" height="48"/>
  <text class="h" x="965" y="350">Bezpiecznik 5 A</text>
  <text class="t" x="965" y="368">na wyjściu 19 V, przed wtykiem M910q</text>

  <path class="wire" d="M965 404 L965 378"/>

  <!-- M910q -->
  <rect class="boxB" x="838" y="176" width="254" height="126"/>
  <text class="h" x="965" y="200">Lenovo ThinkCentre M910q Tiny</text>
  <text class="t" x="965" y="220">i5-6400T · 8 GB · NVMe 256 GB</text>
  <text class="t" x="965" y="240">gniazdo zasilania: oryginalny wtyk</text>
  <text class="t" x="965" y="258">zakres pracy 19–21 V (65 W)</text>
  <text class="t" x="965" y="278">2× DisplayPort → oba wyświetlacze</text>
  <text class="warn" x="965" y="296" text-anchor="middle">test na biurku przed zabudową</text>

  <path class="wire" d="M965 330 L965 302"/>

  <!-- GND rail -->
  <path class="gnd" d="M60 1080 L1120 1080"/>
  <path class="gnd" d="M175 1066 L175 1080"/>
  <path class="gnd" d="M580 1066 L580 1080"/>
  <path class="gnd" d="M965 1066 L965 1080"/>
  <path class="gnd" d="M560 1080 L600 1080 M568 1088 L592 1088 M576 1096 L584 1096"/>
  <text class="tl" x="620" y="1058">Masa wspólna — jeden punkt masy nadwozia, 6 mm², oczyszczony do metalu</text>

  <!-- Legend -->
  <rect x="430" y="740" width="330" height="220" fill="#fbfcfd" stroke="#c8d2da" stroke-width="1.5" rx="6"/>
  <text class="h" x="595" y="762">Przekroje i zabezpieczenia</text>
  <text class="tl" x="446" y="784">akumulator → bezp. → przekaźnik</text>
  <text class="tl" x="700" y="784" text-anchor="end">6 mm²</text>
  <text class="tl" x="446" y="804">ładowarka → bank (do 10 A)</text>
  <text class="tl" x="700" y="804" text-anchor="end">4 mm²</text>
  <text class="tl" x="446" y="824">szyna zbiorcza banku (Cu)</text>
  <text class="tl" x="700" y="824" text-anchor="end">15 × 2 mm</text>
  <text class="tl" x="446" y="844">pakiet AGM → szyna, 7 × 10 A</text>
  <text class="tl" x="700" y="844" text-anchor="end">1,5 mm²</text>
  <text class="tl" x="446" y="864">szyna → LVD → step-up (7,5 A)</text>
  <text class="tl" x="700" y="864" text-anchor="end">2,5 mm²</text>
  <text class="tl" x="446" y="884">step-up → M910q (3,5 A @ 19 V)</text>
  <text class="tl" x="700" y="884" text-anchor="end">1,5 mm²</text>
  <text class="tl" x="446" y="904">odgałęzienie domeny A (&lt; 1 A)</text>
  <text class="tl" x="700" y="904" text-anchor="end">0,75 mm²</text>
  <text class="tl" x="446" y="924">masa wspólna do nadwozia</text>
  <text class="tl" x="700" y="924" text-anchor="end">6 mm²</text>
  <text class="note" x="446" y="948">Przekroje dla trasy ok. 3 m przy spadku napięcia &lt; 3 %.</text>

  <text class="note" x="24" y="1122">Wzmacniacz audio to gotowy moduł samochodowy zasilany osobną gałęzią 12 V prosto z akumulatora rozruchowego, z własną masą — nie obciąża banku buforowego.</text>
</svg>
