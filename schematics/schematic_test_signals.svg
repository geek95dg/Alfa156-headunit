<text class="nt" x="280" y="958">→</text>
<text class="nt" x="306" y="958">uśpienie do S3</text>
<text class="nt" x="80" y="983">250 ms w S3</text>
<text class="nt" x="280" y="983">→</text>
<text class="nt" x="306" y="983">wybudzenie w ~3 s</text>
<text class="nt" x="80" y="1008">250 ms po wyłączeniu</text>
<text class="nt" x="280" y="1008">→</text>
<text class="nt" x="306" y="1008">start zimny, ~40 s</text>
<text class="nt" x="80" y="1033">5 s</text>
<text class="nt" x="280" y="1033">→</text>
<text class="nt" x="306" y="1033">twarde wyłączenie, ~80–120 mA</text>
<text class="nt" x="80" y="1070">Zapłon potwierdzany 2 s — zapad przy</text>
<text class="nt" x="80" y="1090">rozruchu nie usypia BCM. Zamiar jest jednorazowy.</text>
<rect class="note" x="60" y="1140" width="1500" height="62"/>
<text class="nh" x="80" y="1164">KAMERA USB (podróbka C920, za tylną szybą)</text>
<text class="nt" x="80" y="1186">Wpięta wprost w port USB M910q — nie przechodzi przez Arduino. Bieg wsteczny tylko PRZEŁĄCZA obraz na ekran; strumień leci cały czas i jest nagrywany. W S3 port USB gaśnie i kamera milknie — to normalne.</text>
