<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>BCM v8.5 — Alfa Romeo 156 Head Unit</title>
    <!-- Tailwind is PRECOMPILED to a static stylesheet — the 419 KB
         runtime JIT engine (tailwind.js) is gone; it recompiled CSS in
         the browser on every page load. After adding new utility
         classes in JS/HTML run: config/scripts/build-frontend.sh -->
    <link rel="stylesheet" href="/assets/vendor/tailwind.css">
    <link rel="stylesheet" href="/assets/fonts/local-fonts.css">
    <link rel="stylesheet" href="/assets/vendor/leaflet/leaflet.css">
    <script defer src="/assets/vendor/leaflet/leaflet.js"></script>
    <link rel="stylesheet" href="/css/themes.css">
    <script id="bcm-adaptive-rem">
        /* Resolution-adaptive rem base. Tailwind utilities are rem-based,
         * so scaling html font-size rescales the whole dashboard chrome
         * (padding, gaps, button heights, standard text) WITHOUT a
         * transform:scale (which blurs text + breaks touch mapping).
         *
         * Quick-start build runs on a 7" 1024x600 panel and the user asked
         * for a BIGGER UI, so the base is bumped: floor 17px (was 14 → why
         * everything looked tiny on 1024), reference 17px @ 1280, up to 20px
         * on wider panels. Re-applied on resize so swapping panels needs no
         * config. Pixel-literal labels (text-[Npx], icon font-size) are
         * handled by the escape-bracket overrides in themes.css, not here. */
        (function () {
            var REF_W = 1280, REF_PX = 17, MIN_PX = 17, MAX_PX = 20;
            function applyRem() {
                var w = window.innerWidth || REF_W;
                var px = Math.max(MIN_PX, Math.min(MAX_PX, REF_PX * (w / REF_W)));
                document.documentElement.style.fontSize = px.toFixed(2) + "px";
            }
            applyRem();
            window.addEventListener("resize", applyRem);
            window.addEventListener("DOMContentLoaded", applyRem);
        })();
    </script>
    <style>
        /* Adaptive resolution: fits 1024x600 or 1280x800 or scales to window */
        body { margin: 0; overflow: hidden; }
        #app { width: 100vw; height: 100vh; position: relative; }
        .screen-container { width: 100%; height: 100%; }
    </style>
</head>
<body class="font-body overflow-hidden select-none">

    <!-- Screen Container — all screens render here -->
    <div id="app" class="relative w-full h-full"></div>

    <!-- Scripts: defer = downloaded in parallel, executed in document
         order after parse (so app.js still runs first) and never block
         first paint. splash.js must precede app.js — App.init checks
         typeof Splash to arm the wake overlay. -->
    <script defer src="/js/websocket.js"></script>
    <script defer src="/js/components/splash.js"></script>
    <script defer src="/js/app.js"></script>
    <script defer src="/js/components/appbar.js"></script>
    <script defer src="/js/components/navbar.js"></script>
    <script defer src="/js/components/keyboard.js"></script>
    <script defer src="/js/components/notifications.js"></script>
    <script defer src="/js/components/media-player.js"></script>
    <script defer src="/js/components/charts.js"></script>
    <script defer src="/js/screens/init.js"></script>
    <script defer src="/js/screens/main.js"></script>
    <script defer src="/js/screens/android_auto.js"></script>
    <script defer src="/js/screens/trip.js"></script>
    <script defer src="/js/screens/weather.js"></script>
    <script defer src="/js/screens/service.js"></script>
    <script defer src="/js/screens/dvr.js"></script>
    <script defer src="/js/screens/performance.js"></script>
    <script defer src="/js/screens/phone.js"></script>
    <script defer src="/js/screens/audio.js"></script>
    <script defer src="/js/screens/settings.js"></script>
</body>
</html>
