<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

    <!-- Tailwind is PRECOMPILED to a static stylesheet — the 419 KB
         runtime JIT engine (tailwind.js) is gone; it recompiled CSS in
         the browser on every page load. After adding new utility

    <link rel="stylesheet" href="/assets/fonts/local-fonts.css">

</head>
