<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Autodelta Sport A4 Diagnostics</title>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ec5b13",
                        "background-light": "#f8f6f6",
                        "background-dark": "#221610",
                    },
                    fontFamily: {
                        "display": ["Public Sans"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Public Sans', sans-serif;
            background-color: #000000; /* Pure black background for the device feel */
            color: #ffffff; /* Stark white text */
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Simulating the 800x480 display area */
        .device-screen {
            width: 800px;
            height: 480px;
            background-color: #000000;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body>
<div class="device-screen">
<!-- Header -->
<div class="flex items-center justify-between px-4 py-2 border-b border-primary/30 shrink-0 h-12">
<div class="flex items-center gap-4 text-white/70">
<span class="material-symbols-outlined text-xl" data-icon="bluetooth">bluetooth</span>
<span class="material-symbols-outlined text-xl" data-icon="android">android</span>
</div>
<div class="flex flex-col items-center justify-center flex-1">
<!-- Placeholder for Alfa Logo - using text for simplicity here, but in reality would be an image -->
<div class="text-primary font-bold text-lg tracking-widest uppercase">Alfa Romeo</div>
</div>
<div class="flex items-center gap-4 text-white/90 text-sm font-medium">
<span>12:00 PM</span>
<span>|</span>
<span>Oct 24</span>
<span>|</span>
<div class="flex items-center gap-1">
<span class="material-symbols-outlined text-lg" data-icon="thermometer">thermometer</span>
<span>72°F</span>
</div>
</div>
</div>
<!-- Main Content Area -->
<div class="flex flex-1 overflow-hidden">
<!-- Diagnostics Sidebar -->
<div class="w-1/3 border-r border-primary/30 flex flex-col p-4 gap-3 overflow-y-auto custom-scrollbar">
<h2 class="text-primary font-bold text-xl uppercase tracking-wider mb-2">A4 Diagnostics</h2>
<!-- Diagnostic Cards -->
<div class="bg-background-dark/50 border border-primary/40 rounded-lg p-3 flex justify-between items-center">
<div class="flex flex-col">
<span class="text-white/60 text-xs uppercase tracking-wider">Engine Temp</span>
<span class="text-white font-bold text-xl">195°F</span>
</div>
<span class="material-symbols-outlined text-primary text-2xl" data-icon="device_thermostat">device_thermostat</span>
</div>
<div class="bg-background-dark/50 border border-primary/40 rounded-lg p-3 flex justify-between items-center">
<div class="flex flex-col">
<span class="text-white/60 text-xs uppercase tracking-wider">Oil Pressure</span>
<span class="text-white font-bold text-xl">45 PSI</span>
</div>
<span class="material-symbols-outlined text-primary text-2xl" data-icon="oil_barrel">oil_barrel</span>
</div>
<div class="bg-background-dark/50 border border-primary/40 rounded-lg p-3 flex justify-between items-center">
<div class="flex flex-col">
<span class="text-white/60 text-xs uppercase tracking-wider">Battery</span>
<span class="text-white font-bold text-xl">13.8V</span>
</div>
<span class="material-symbols-outlined text-primary text-2xl" data-icon="battery_charging_full">battery_charging_full</span>
</div>
<div class="bg-background-dark/50 border border-primary/40 rounded-lg p-3 flex justify-between items-center">
<div class="flex flex-col">
<span class="text-white/60 text-xs uppercase tracking-wider">Tire Pressure</span>
<span class="text-white font-bold text-xl">34 PSI</span>
</div>
<span class="material-symbols-outlined text-primary text-2xl" data-icon="tire_repair">tire_repair</span>
</div>
</div>
<!-- Main Image Area -->
<div class="w-2/3 relative flex flex-col justify-center items-center bg-background-dark p-6">
<!-- High-quality pencil sketch placeholder -->
<div class="w-full h-full bg-cover bg-center rounded-xl border border-primary/20 shadow-[0_0_30px_rgba(236,91,19,0.1)] relative overflow-hidden flex items-center justify-center" data-alt="High-quality detailed pencil sketch of an Alfa Romeo 1600 Junior Z, dramatic lighting, pure black background, stark white highlights, Autodelta orange accents" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDcExub5WHGTnV16FjxpmVIk0REmdByfTAWk6LhFmbBSjlwQUyEPHmFKsbTB5kygw76M58GwmDrbOGN6cCdadljT1OoL8Wa2OeUMYc0HBbjd38ShIFPYk7ig7MX0m_i6yG9d47GDwpTLymYoUJgQPevK1SCpHE7ysMrf_v0U1cvN8ykhDkmjjmDJkK5Ze3Xa_QccMEU5SqSqxjBIulDZRBde2wBv_WPBAUFUoEYzIS3Cpnw8_LiBoW8whtLXKb5wFL2xvEuYxvh1SM');">
<!-- Overlay gradient for depth -->
<div class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-transparent opacity-80"></div>
<!-- Car Label -->
<div class="absolute bottom-4 left-6">
<h3 class="text-white font-bold text-2xl tracking-wide shadow-sm">1600 Junior Z</h3>
<p class="text-primary font-medium tracking-widest text-sm uppercase">Autodelta Sport</p>
</div>
</div>
</div>
</div>
<!-- Bottom Navigation (Shared Component Integration styled for this theme) -->
<div class="flex gap-2 border-t border-primary/30 bg-black px-4 pb-2 pt-2 shrink-0 h-16">
<a class="flex flex-1 flex-col items-center justify-end gap-1 text-white/50 hover:text-white transition-colors" href="#">
<span class="material-symbols-outlined text-[24px]" data-icon="home" data-weight="regular">home</span>
</a>
<a class="flex flex-1 flex-col items-center justify-end gap-1 text-white/50 hover:text-white transition-colors" href="#">
<span class="material-symbols-outlined text-[24px]" data-icon="directions_car" data-weight="regular">directions_car</span>
</a>
<!-- Active State -->
<a class="flex flex-1 flex-col items-center justify-end gap-1 text-primary" href="#">
<div class="bg-primary/20 rounded-full p-1 w-12 h-8 flex items-center justify-center">
<span class="material-symbols-outlined text-[24px]" data-icon="build" data-weight="fill" style="font-variation-settings: 'FILL' 1;">build</span>
</div>
</a>
<a class="flex flex-1 flex-col items-center justify-end gap-1 text-white/50 hover:text-white transition-colors" href="#">
<span class="material-symbols-outlined text-[24px]" data-icon="settings" data-weight="regular">settings</span>
</a>
</div>
</div>
</body></html>
