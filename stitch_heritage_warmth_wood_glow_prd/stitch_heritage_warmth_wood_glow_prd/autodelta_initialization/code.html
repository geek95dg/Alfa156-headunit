<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Autodelta Boot Sequence</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,700;0,800;1,700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "autodelta-orange": "#FF4500",
                        "zinc-950": "#09090b",
                    },
                    fontFamily: {
                        "headline": ["Public Sans"],
                        "body": ["Public Sans"],
                        "label": ["Public Sans"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        @keyframes breathing {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.02); }
        }
        .animate-breathing {
            animation: breathing 3s ease-in-out infinite;
        }
        .scanline {
            background: linear-gradient(to bottom, transparent 50%, rgba(255, 69, 0, 0.05) 50%);
            background-size: 100% 4px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-black text-white h-[480px] w-[800px] overflow-hidden flex flex-col font-body relative">
<!-- Background Texture Layer -->
<div class="absolute inset-0 pointer-events-none scanline opacity-30"></div>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col items-center justify-center relative z-10 px-12">
<!-- Technical Grid Background Decor -->
<div class="absolute inset-0 flex items-center justify-center opacity-10">
<div class="w-full h-px bg-autodelta-orange"></div>
<div class="h-full w-px bg-autodelta-orange"></div>
</div>
<!-- Central Image: Alfa Romeo 1600 Junior Z Sketch -->
<div class="relative w-[540px] h-[280px] flex items-center justify-center">
<!-- Sketch Container with Breathing Effect -->
<div class="animate-breathing">
<img alt="Inverted white line pencil sketch of an Alfa Romeo 1600 Junior Z on a black background" class="w-full h-full object-contain filter invert brightness-200" data-alt="high-contrast inverted white line pencil sketch of a classic Alfa Romeo 1600 Junior Z silhouette on pure black background sharp technical detail" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCApBNcVPMOQ2rH1PPRIcTxmigyPK_W0SwFP29LtQ3GMinKeTKUJCGenjSbvlLyUeiG7rlNT5KJsBG8EoENXfnR70JP9YN1QI3a8bfKpdn0u2YcbRNFFXQahGBSlyV9qZWmW0DrRDvk5KBo4a5eMeFSyt9r4MY_WsrYPdtTwvjf-wqIxGOSFjcZdy9pi16L2GZBZ_UwGN_nVfRs4sZjMIy5jDUGZAGYq4CneuBLkTZdh9fOmoN4dhpN5UbVN4RYXKlmrQEpyXv-R_g"/>
</div>
<!-- Technical Corner Accents -->
<div class="absolute top-0 left-0 w-8 h-8 border-t-2 border-l-2 border-autodelta-orange"></div>
<div class="absolute top-0 right-0 w-8 h-8 border-t-2 border-r-2 border-white"></div>
<div class="absolute bottom-0 left-0 w-8 h-8 border-b-2 border-l-2 border-white"></div>
<div class="absolute bottom-0 right-0 w-8 h-8 border-b-2 border-r-2 border-autodelta-orange"></div>
</div>
<!-- Status Information -->
<div class="mt-16 w-full max-w-md">
<div class="flex flex-col items-center gap-3">
<!-- Status Bar Decor -->
<div class="w-full h-1 bg-zinc-900 overflow-hidden">
<div class="h-full bg-autodelta-orange w-2/3"></div>
</div>
<div class="flex justify-between w-full items-end">
<div class="flex flex-col gap-1">
<span class="text-[10px] font-bold text-white/40 tracking-[0.2em]">SYSTEM_VERSION</span>
<span class="text-xs text-white font-mono italic">v2.0.4_AUTODELTA</span>
</div>
<div class="text-center">
<h1 class="text-autodelta-orange font-bold text-lg tracking-[0.3em] uppercase italic">
                            AUTODELTA CORE ENGAGED
                        </h1>
</div>
<div class="flex flex-col gap-1 items-end">
<span class="text-[10px] font-bold text-white/40 tracking-[0.2em]">UNIT_ID</span>
<span class="text-xs text-white font-mono italic">AR-1600-JZ</span>
</div>
</div>
</div>
</div>
</main>
<!-- Bottom Technical Strip -->
<footer class="h-8 bg-zinc-950/80 border-t border-autodelta-orange/30 flex items-center justify-between px-6 z-20">
<div class="flex items-center gap-4">
<div class="flex items-center gap-1">
<span class="w-1.5 h-1.5 rounded-full bg-autodelta-orange"></span>
<span class="text-[9px] text-white/60 tracking-widest">SENSORS ONLINE</span>
</div>
<div class="flex items-center gap-1">
<span class="w-1.5 h-1.5 rounded-full bg-white"></span>
<span class="text-[9px] text-white/60 tracking-widest">TELEMETRY ACTIVE</span>
</div>
</div>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[14px] text-autodelta-orange">settings_input_component</span>
<span class="text-[9px] text-autodelta-orange font-bold tracking-[0.2em]">X-AXIS_CALIBRATED</span>
</div>
</footer>
<!-- Overlay Corner Elements -->
<div class="absolute top-6 left-6 z-30 flex items-center gap-2">
<span class="material-symbols-outlined text-autodelta-orange text-lg">token</span>
<div class="flex flex-col">
<span class="text-[10px] font-extrabold text-white leading-tight italic">ALFA ROMEO</span>
<span class="text-[8px] text-autodelta-orange leading-tight tracking-[0.1em]">RACING DIVISION</span>
</div>
</div>
<div class="absolute top-6 right-6 z-30 text-right">
<span class="text-[10px] font-mono text-white/50 tracking-tighter">EST. 1963</span>
</div>
</body></html>
