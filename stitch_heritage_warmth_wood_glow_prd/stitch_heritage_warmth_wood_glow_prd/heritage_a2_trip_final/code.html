<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Trip A2 Statistics</title>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ec5b13",
                        "background-light": "#f8f6f6",
                        "background-dark": "#221610",
                    },
                    fontFamily: {
                        "display": ["Public Sans"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light font-display h-[480px] w-[800px] overflow-hidden flex flex-col">
<!-- Header -->
<div class="flex items-center justify-between p-4 bg-background-dark text-background-light h-14 shrink-0 border-b border-primary/20">
<div class="flex items-center gap-4">
<span class="text-lg font-medium">10:42 AM</span>
<span class="text-sm text-background-light/70">Oct 24</span>
</div>
<h2 class="text-xl font-bold text-primary tracking-wider uppercase">Alfa Romeo</h2>
<div class="flex items-center gap-4">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">bluetooth</span>
<span class="material-symbols-outlined text-background-light" style="font-variation-settings: 'FILL' 1;">android</span>
</div>
<span class="text-lg font-medium">68°F</span>
</div>
</div>
<!-- Main Content Area -->
<div class="flex-1 flex overflow-hidden">
<!-- Left Column: Stats -->
<div class="w-[300px] p-6 flex flex-col gap-4 border-r border-primary/20 bg-background-dark/5">
<h1 class="text-2xl font-bold text-background-dark uppercase tracking-wide mb-2">Trip A2</h1>
<div class="flex flex-col gap-1 p-4 rounded-xl bg-white shadow-sm border border-primary/10">
<p class="text-sm font-medium text-background-dark/70 uppercase tracking-wider">Distance</p>
<p class="text-3xl font-bold text-background-dark">142.5 <span class="text-lg text-background-dark/50">mi</span></p>
</div>
<div class="flex flex-col gap-1 p-4 rounded-xl bg-white shadow-sm border border-primary/10">
<p class="text-sm font-medium text-background-dark/70 uppercase tracking-wider">Avg Speed</p>
<p class="text-3xl font-bold text-background-dark">48 <span class="text-lg text-background-dark/50">mph</span></p>
</div>
<div class="flex flex-col gap-1 p-4 rounded-xl bg-white shadow-sm border border-primary/10">
<p class="text-sm font-medium text-background-dark/70 uppercase tracking-wider">Travel Time</p>
<p class="text-3xl font-bold text-background-dark">2<span class="text-lg text-background-dark/50">h</span> 58<span class="text-lg text-background-dark/50">m</span></p>
</div>
</div>
<!-- Right Column: Graph -->
<div class="flex-1 p-6 flex flex-col">
<div class="flex justify-between items-end mb-6">
<div>
<p class="text-sm font-medium text-background-dark/70 uppercase tracking-wider">Avg Fuel Consumption</p>
<p class="text-4xl font-bold text-primary mt-1">28.4 <span class="text-xl text-background-dark/50">MPG</span></p>
</div>
<div class="flex items-center gap-2 text-sm font-medium">
<span class="text-background-dark/70">Last 50 Miles</span>
<span class="text-green-600 bg-green-100 px-2 py-1 rounded-full">+1.2%</span>
</div>
</div>
<!-- Bar Chart Area -->
<div class="flex-1 bg-white rounded-xl shadow-sm border border-primary/10 p-6 flex items-end justify-between relative">
<!-- Y Axis Labels -->
<div class="absolute left-2 top-6 bottom-8 flex flex-col justify-between text-xs text-background-dark/50 font-medium">
<span>50</span>
<span>40</span>
<span>30</span>
<span>20</span>
<span>10</span>
</div>
<!-- Grid Lines -->
<div class="absolute inset-0 left-8 right-6 top-6 bottom-8 flex flex-col justify-between pointer-events-none">
<div class="w-full border-t border-dashed border-background-dark/10"></div>
<div class="w-full border-t border-dashed border-background-dark/10"></div>
<div class="w-full border-t border-dashed border-background-dark/10"></div>
<div class="w-full border-t border-dashed border-background-dark/10"></div>
<div class="w-full border-t border-background-dark/20"></div>
</div>
<!-- Bars -->
<div class="flex items-end justify-around w-full h-full pl-6 pb-2 pt-4 relative z-10 gap-2">
<div class="w-8 bg-background-dark/20 rounded-t-sm" style="height: 15%;"></div>
<div class="w-8 bg-background-dark/20 rounded-t-sm" style="height: 25%;"></div>
<div class="w-8 bg-background-dark/20 rounded-t-sm" style="height: 45%;"></div>
<div class="w-8 bg-primary/40 rounded-t-sm" style="height: 60%;"></div>
<div class="w-8 bg-primary/60 rounded-t-sm" style="height: 75%;"></div>
<div class="w-8 bg-primary/80 rounded-t-sm" style="height: 55%;"></div>
<div class="w-8 bg-primary rounded-t-sm shadow-[0_0_15px_rgba(236,91,19,0.4)]" style="height: 85%;"></div>
</div>
<!-- X Axis Labels -->
<div class="absolute bottom-2 left-14 right-8 flex justify-between text-xs text-background-dark/50 font-medium">
<span>-50m</span>
<span>-40m</span>
<span>-30m</span>
<span>-20m</span>
<span>-10m</span>
<span>-5m</span>
<span>Now</span>
</div>
</div>
</div>
</div>
<!-- Bottom Nav (Shared Component Logic applied - Destination view) -->
<div class="flex gap-2 border-t border-primary/20 bg-background-dark px-4 pb-3 pt-2 shrink-0 h-[72px]">
<a class="flex flex-1 flex-col items-center justify-end gap-1 text-background-light/70 hover:text-primary transition-colors" href="#">
<div class="flex h-8 items-center justify-center">
<span class="material-symbols-outlined text-[24px]">home</span>
</div>
</a>
<a class="flex flex-1 flex-col items-center justify-end gap-1 text-background-light/70 hover:text-primary transition-colors" href="#">
<div class="flex h-8 items-center justify-center">
<span class="material-symbols-outlined text-[24px]">map</span>
</div>
</a>
<a class="flex flex-1 flex-col items-center justify-end gap-1 text-background-light/70 hover:text-primary transition-colors" href="#">
<div class="flex h-8 items-center justify-center">
<span class="material-symbols-outlined text-[24px]">music_note</span>
</div>
</a>
<a class="flex flex-1 flex-col items-center justify-end gap-1 rounded-full text-primary" href="#">
<div class="flex h-8 items-center justify-center">
<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1;">directions_car</span>
</div>
</a>
</div>
</body></html>
