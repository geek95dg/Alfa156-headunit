<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,100..900;1,100..900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              'walnut': '#080808',
              'amber-glow': '#FFBF00',
              'heritage-red': '#B22222'
            },
            fontFamily: {
              "headline": ["Public Sans"],
              "body": ["Public Sans"],
              "label": ["Public Sans"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
      @keyframes pulse-soft {
        0%, 100% { opacity: 0.4; filter: drop-shadow(0 0 15px rgba(255, 191, 0, 0.2)); }
        50% { opacity: 0.9; filter: drop-shadow(0 0 35px rgba(255, 191, 0, 0.5)); }
      }
      .animate-pulse-soft {
        animation: pulse-soft 4s ease-in-out infinite;
      }
      .sketch-mask {
        mask-image: radial-gradient(circle, black 60%, transparent 95%);
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-walnut flex items-center justify-center min-h-screen overflow-hidden" style="width: 800px; height: 480px; margin: auto;">
<!-- Splash Screen Container -->
<main class="relative w-full h-full flex flex-col items-center justify-center overflow-hidden">
<!-- Vignette/Ambient Background Layer -->
<div class="absolute inset-0 bg-[radial-gradient(circle_at_center,_transparent_0%,_#000000_90%)] z-10"></div>
<!-- Heritage Texture Overlay -->
<div class="absolute inset-0 opacity-10 mix-blend-overlay pointer-events-none z-20" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuANULOiAvaMRGpPG47NjWtDnAmc-e-rv-wOXz3gdHqEZnR9Qg70yf01tpeKbDyuOQPSynlDZTqm8juuzwetHTU_3PwOKIaqTOABrngkWrsBA8GlTvNidt79rjJnL_GkfKD8LlW8ayzxtCsa5_SLU_nk4CRAZsfopSFNSRak6rHpG4qH17nPufVbVRxUfo-_DuIDLbbOIZ3i1FHOWlxKQHfZ_jVTbEUkpfSQjhwuhMB4HUaCxY_o2ODiEz2_n10b6owCxuZFqVnH5fY');">
</div>
<!-- Central Focal Point: Giulia GTA Sketch -->
<div class="relative z-30 flex flex-col items-center justify-center">
<div class="relative group">
<!-- Soft Amber Pulse Effect behind the sketch -->
<div class="absolute inset-0 rounded-full bg-amber-glow/10 blur-[100px] animate-pulse-soft"></div>
<!-- The "Breathing" Sketch -->
<div class="sketch-mask relative">
<img alt="Alfa Romeo Giulia GTA 1965 pencil sketch" class="w-[480px] h-auto object-contain mix-blend-screen opacity-80 animate-pulse-soft grayscale brightness-125 transition-all" data-alt="Intricate technical pencil sketch of a 1965 Alfa Romeo Giulia GTA on textured parchment paper with elegant fine lines and soft shading" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCOucRg9DleNVyLYf5Y1yuiFUagbZAuHq4SuPs054-BkvS1mjCB5AGwgcJnmXRttoPlm_xlszRV02RlT8UACQUa4kPA1w-PGsPGsUFigYbOOhwLZRiN-iwa81c25oKF34NLQs7fMoVYLnR7rgefMjS6SfRDAQBuxOzeM8UTQ4CnFJuY4W-HDXfOh6PZv8CqjZS_GswceQr4HXX1k5sm95cK9uH5ndQPu5MXOtBU5qemZZcH3KVcJMwsBfn6jTRCCUkPPhcq_P8XiIY"/>
</div>
</div>
<!-- Brand Identity -->
<div class="mt-8 flex flex-col items-center">
<div class="flex items-center space-x-4 mb-2">
<div class="h-[1px] w-12 bg-gradient-to-r from-transparent to-amber-glow/40"></div>
<span class="text-amber-glow font-headline tracking-[0.4em] text-xs font-light">ALFA ROMEO</span>
<div class="h-[1px] w-12 bg-gradient-to-l from-transparent to-amber-glow/40"></div>
</div>
</div>
</div>
<!-- Bottom Status Area -->
<div class="absolute bottom-12 z-40 w-full flex flex-col items-center">
<!-- Progress Track (Subtle) -->
<div class="w-48 h-[2px] bg-zinc-900 mb-6 relative overflow-hidden">
<div class="absolute top-0 left-0 h-full w-1/3 bg-amber-glow/60 shadow-[0_0_8px_rgba(255,191,0,0.4)]"></div>
</div>
<!-- Status Text -->
<p class="text-amber-glow font-body tracking-[0.2em] text-[10px] font-bold opacity-60 flex items-center">
<span class="material-symbols-outlined text-[14px] mr-2" style="font-variation-settings: 'FILL' 1;">settings_bluetooth</span>
                CHECKING SYSTEMS...
            </p>
</div>
<!-- Corner Accents (Walnut & Amber) -->
<div class="absolute top-8 left-8 w-8 h-8 border-t border-l border-amber-glow/20 z-30"></div>
<div class="absolute top-8 right-8 w-8 h-8 border-t border-r border-amber-glow/20 z-30"></div>
<div class="absolute bottom-8 left-8 w-8 h-8 border-b border-l border-amber-glow/20 z-30"></div>
<div class="absolute bottom-8 right-8 w-8 h-8 border-b border-r border-amber-glow/20 z-30"></div>
</main>
</body></html>
