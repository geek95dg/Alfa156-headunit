<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700;1,900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
                brand: {
                    charcoal: "#161618",
                    accent: "#3b82f6", // Fresh blue
                    white: "#ffffff"
                }
            },
            fontFamily: {
              "headline": ["Public Sans"],
              "body": ["Public Sans"],
              "label": ["Public Sans"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        body {
            background-color: #161618;
            margin: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            font-family: 'Public Sans', sans-serif;
        }
        
        /* 800x480 Constraint for the "Device" viewport simulation */
        .device-canvas {
            width: 800px;
            height: 480px;
            position: relative;
            background-color: #161618;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .sketch-container {
            width: 80%;
            height: auto;
            max-height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Subtle glow for the 'breathing' effect */
        .glow-effect {
            position: absolute;
            width: 120%;
            height: 120%;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.08) 0%, rgba(22, 22, 24, 0) 70%);
            z-index: 0;
        }

        .status-text {
            position: absolute;
            bottom: 40px;
            letter-spacing: 0.2em;
        }

        .progress-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 2px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
        }

        .progress-fill {
            height: 100%;
            width: 35%;
            background: linear-gradient(90deg, transparent, #3b82f6, transparent);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-brand-charcoal text-white">
<!-- Main Device Viewport (800x480) -->
<main class="device-canvas">
<!-- Ambient Background Element -->
<div class="glow-effect"></div>
<!-- Center Art: Detailed Pencil Sketch -->
<div class="sketch-container z-10">
<!-- As per instructions: "Center a highly detailed pencil sketch of an Alfa Romeo 156 Berlina" -->
<img alt="Alfa Romeo 156 sketch" class="w-full h-auto object-contain opacity-80 mix-blend-screen grayscale contrast-125" data-alt="Detailed artistic charcoal and pencil sketch of an Alfa Romeo 156 Berlina from a 3/4 front view on textured paper background, soft side lighting" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB4ORhijCP3AHHVA824_EvlrJeEmtzy408qWh0kKyAJigkQzwopzICsraZLOdowBZbr494nnsRgZvmWJtml4ojQK8PiwNWL2pl_pFIMM0szubecmRy3O7oENUX06n3sJ5rkPyTNptMnOzShzH4zCz0GEQh1RTiKIuP9uRuLt1ObZzZTaVBqw4-84qZmwPBjUg3Li2nRdSCQl5w6cdUVC73V2Ie4HqfA5pVP0_lPmwdczC-mQRB2RoOu3KJibhD98YnGb5eEsUVFTuQ"/>
</div>
<!-- Brand Identity Element (Subtle) -->
<div class="absolute top-12 flex items-center gap-3 opacity-40">
<div class="h-[1px] w-8 bg-brand-accent"></div>
<span class="text-[10px] font-bold tracking-[0.3em] uppercase text-white">Centro Stile Alfa Romeo</span>
<div class="h-[1px] w-8 bg-brand-accent"></div>
</div>
<!-- Status Information -->
<div class="status-text flex flex-col items-center gap-2">
<p class="text-[10px] font-medium text-zinc-500">SYSTEM INITIALIZING...</p>
<div class="flex gap-1">
<div class="w-1 h-1 rounded-full bg-brand-accent"></div>
<div class="w-1 h-1 rounded-full bg-zinc-700"></div>
<div class="w-1 h-1 rounded-full bg-zinc-700"></div>
</div>
</div>
<!-- Corner Accents -->
<div class="absolute top-8 left-8 border-l border-t border-brand-accent/30 w-4 h-4"></div>
<div class="absolute top-8 right-8 border-r border-t border-brand-accent/30 w-4 h-4"></div>
<div class="absolute bottom-8 left-8 border-l border-b border-brand-accent/30 w-4 h-4"></div>
<div class="absolute bottom-8 right-8 border-r border-b border-brand-accent/30 w-4 h-4"></div>
<!-- Loading Progress (System feel) -->
<div class="progress-bar">
<div class="progress-fill"></div>
</div>
</main>
<!-- Implicitly suppress TopAppBar and BottomNavBar as per "No top bar or bottom navigation" instructions for Splash screens -->
</body></html>
